tests:
- name: ateapi_cold_resume_pause_fake_6x8cpu_size10_walvol
  type: locust
  description: 'ate-api-server cold resume on the fake data plane, 6 ate-api-server
    replicas at 8 CPUs, size10 Postgres with the WAL on its own volume: rate ladder 5000-10000 cold resumes/s'
  targetCluster: dev
  file: /app/tests/resumepaused.py,/app/shapes/ladder_shape.py
  duration: 35m
  users: 14000
  workerCount: 200
  runnerCpu: '16'
  runnerMemory: 6Gi
  ateArgs:
  - --cluster-size=size10
  isolate:
    delay: 150ms
  ateapi:
    cpu: 8
    replicas: 6
    memory: 4Gi
    poolMaxConns: 40
    postgresArgs:
    - track_wal_io_timing=on
    - track_io_timing=on
  flags:
  - --ladder-spawn-rate
  - '14000'
  - --ladder
  - 14000:3m@5000,14000:3m@5500,14000:3m@6000,14000:3m@6500,14000:3m@7000,14000:3m@7500,14000:3m@8000,14000:3m@8500,14000:3m@9000,14000:3m@9500,14000:3m@10000
