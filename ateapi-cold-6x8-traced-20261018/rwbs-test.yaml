apiVersion: v1
kind: Pod
metadata: {name: rwbs-test, namespace: kernel-trace}
spec:
  nodeSelector: {kubernetes.io/hostname: gke-nh-prow-parity-default-pool-ca559d59-4d75}
  hostPID: true
  restartPolicy: Never
  containers:
  - name: bt
    image: quay.io/iovisor/bpftrace:latest
    securityContext: {privileged: true}
    command: ["sh", "-c", "mount -t tracefs tracefs /sys/kernel/tracing 2>/dev/null; (dd if=/dev/zero of=/var/tmp/x bs=8k count=3000 oflag=dsync 2>&1) & sleep 2; timeout 3 bpftrace -e 'tracepoint:block:block_rq_issue /args.dev == (259 << 20)/ { @i++; if (@i < 30) { printf(\"I %s sec=%llu n=%u\\n\", args.rwbs, args.sector, args.nr_sector); } } tracepoint:block:block_rq_complete /args.dev == (259 << 20)/ { @c++; if (@c < 30) { printf(\"C %s sec=%llu n=%u\\n\", args.rwbs, args.sector, args.nr_sector); } }'; wait; rm -f /var/tmp/x"]
    volumeMounts:
    - {name: sys, mountPath: /sys}
    - {name: modules, mountPath: /lib/modules, readOnly: true}
    - {name: vt, mountPath: /var/tmp}
  volumes:
  - {name: sys, hostPath: {path: /sys}}
  - {name: modules, hostPath: {path: /lib/modules}}
  - {name: vt, hostPath: {path: /var/tmp}}
