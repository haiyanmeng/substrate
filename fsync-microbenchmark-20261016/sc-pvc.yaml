apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fsync-bench-hyperdisk-balanced
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-balanced
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pdb-fs, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: standard-rwo, resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pdb-block, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: standard-rwo, volumeMode: Block, resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pdssd-fs, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: premium-rwo, resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: hdb-fs, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: fsync-bench-hyperdisk-balanced, resources: {requests: {storage: 500Gi}}}
