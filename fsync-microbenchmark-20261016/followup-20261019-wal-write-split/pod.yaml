# Writer (Postgres + dd patterns) and tracer share the volume and /shared.
# The tracer is privileged to load bpftrace programs on the host kernel.
apiVersion: v1
kind: Pod
metadata: {name: split, namespace: fsync-bench}
spec:
  nodeSelector: {kubernetes.io/hostname: gke-nh-prow-parity-default-pool-ca559d59-9v65}
  restartPolicy: Never
  containers:
  - name: writer
    image: postgres:18-alpine
    command: ["sh", "/scripts/writer.sh"]
    securityContext: {runAsUser: 0}
    resources: {requests: {cpu: "8", memory: 8Gi}, limits: {memory: 12Gi}}
    volumeMounts:
    - {name: scripts, mountPath: /scripts}
    - {name: data, mountPath: /data}
    - {name: shared, mountPath: /shared}
  - name: tracer
    image: quay.io/iovisor/bpftrace:latest
    command: ["sh", "/scripts/tracer.sh"]
    securityContext: {privileged: true}
    volumeMounts:
    - {name: scripts, mountPath: /scripts}
    - {name: data, mountPath: /data}
    - {name: shared, mountPath: /shared}
    - {name: sys, mountPath: /sys}
    - {name: modules, mountPath: /lib/modules, readOnly: true}
  volumes:
  - {name: scripts, configMap: {name: split}}
  - {name: data, persistentVolumeClaim: {claimName: pdb-split}}
  - {name: shared, emptyDir: {}}
  - {name: sys, hostPath: {path: /sys}}
  - {name: modules, hostPath: {path: /lib/modules}}
