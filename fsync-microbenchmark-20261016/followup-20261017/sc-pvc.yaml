# Provisioned Hyperdisk against pd-balanced: two volumes per disk type.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fsync-bench-hdb-provisioned
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-balanced
  provisioned-iops-on-create: "20000"
  provisioned-throughput-on-create: "600Mi"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fsync-bench-hde
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-extreme
  provisioned-iops-on-create: "50000"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pdb-a, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: standard-rwo, resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pdb-b, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: standard-rwo, resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: hdbp-a, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: fsync-bench-hdb-provisioned, resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: hdbp-b, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: fsync-bench-hdb-provisioned, resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: hde-a, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: fsync-bench-hde, resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: hde-b, namespace: fsync-bench}
spec: {accessModes: [ReadWriteOnce], storageClassName: fsync-bench-hde, resources: {requests: {storage: 500Gi}}}
