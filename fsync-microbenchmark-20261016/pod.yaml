apiVersion: v1
kind: Pod
metadata: {name: bench, namespace: fsync-bench}
spec:
  nodeSelector: {kubernetes.io/hostname: gke-nh-prow-parity-default-pool-ca559d59-9v65}
  restartPolicy: Never
  containers:
  - name: bench
    image: postgres:18-alpine
    command: ["sh", "/scripts/bench.sh"]
    securityContext: {runAsUser: 0}
    resources: {requests: {cpu: "2", memory: 4Gi}, limits: {memory: 12Gi}}
    volumeMounts:
    - {name: scripts, mountPath: /scripts}
    - {name: tmpfs, mountPath: /mnt/tmpfs}
    - {name: pdb, mountPath: /mnt/pdb}
    - {name: pdssd, mountPath: /mnt/pdssd}
    - {name: hdb, mountPath: /mnt/hdb}
    volumeDevices:
    - {name: pdbblock, devicePath: /dev/pdb-block}
  volumes:
  - {name: scripts, configMap: {name: bench}}
  - {name: tmpfs, emptyDir: {medium: Memory, sizeLimit: 10Gi}}
  - {name: pdb, persistentVolumeClaim: {claimName: pdb-fs}}
  - {name: pdbblock, persistentVolumeClaim: {claimName: pdb-block}}
  - {name: pdssd, persistentVolumeClaim: {claimName: pdssd-fs}}
  - {name: hdb, persistentVolumeClaim: {claimName: hdb-fs}}
