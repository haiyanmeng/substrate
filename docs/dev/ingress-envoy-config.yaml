# =============================================================================
# PART 2 -- xDS SNAPSHOT (generated by xds.go, delivered over ADS)
#
# Separate YAML document: these are xDS resources, not bootstrap keys. Envoy
# never reads them from a file. Grouped by discovery type and sorted by name.
# =============================================================================

# ---------------------------------------------------------------------------
# LISTENERS (5)
#
# Four socket listeners plus main_internal, which has no socket. Every socket
# listener keeps a 0.0.0.0 primary and gains one "::" additionalAddresses entry
# on the same port (Ipv4Compat deliberately false -- two sockets, not one
# v4-mapped socket, because the ingress path does read the peer address).
