# The complete Envoy configuration of the Substrate INGRESS dataplane
# (the `envoy` sidecar in the atenet-router pod), as of main @ 60073ecd.
#
# GENERATED, NOT AUTHORITATIVE. Nothing reads this file; it is a snapshot for
# reading and reviewing, and a companion to docs/dev/protocol-matrix.md §3.
# The real config lives in two places:
#
#   part 1, bootstrap  -- manifests/ate-install/atenet-router.yaml, ConfigMap
#                         atenet-router-envoy-config. Static, and all it does
#                         is point Envoy at the xDS server.
#
#   part 2, the rest   -- cmd/atenet/internal/router/xds.go, built in Go and
#                         pushed over ADS to 127.0.0.1:18000 by the router
#                         sidecar in the same pod. See UpdateSnapshot().
#
# Part 1 is copied verbatim from the ConfigMap, so it is snake_case. Part 2 is
# the protojson lowerCamelCase form Envoy emits in /config_dump, produced by
# driving the generator the way startEnvoyDataplane does with the flag values
# the manifest passes and cmd.go defaults for the rest:
#
#   --port-http=8080  --port-https=8443  --port-connect=8081
#   --port-connect-tls=8444  --port-xds=18000  --port-extproc=50051
#   --extproc-address=127.0.0.1
#   --envoy-cert-path=/run/servicedns.podcert.ate.dev/credential-bundle.pem
#   --upstream-credential-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
#   --upstream-trust-bundle=/run/podidentity.podcert.ate.dev/trust-bundle.pem
#   --upstream-spiffe-prefix=spiffe://cluster.local/
#   --route-timeout=10s          (default; sets the route timeout)
#   --parked-request-budget=5s   (default; ext_proc messageTimeout = budget + 5s)
#   --parked-request-max=1024    (default; ext_proc max_requests = 2 x max)
#   OTEL_EXPORTER_OTLP_ENDPOINT from manifests/ate-install/ate-otel-config.yaml,
#   root trace sampling at dataPlaneTraceRatio (1%)
#
# Change any of those and this file goes stale. To re-render part 2, add a
# throwaway test to package router that calls the setters above, runs
# UpdateSnapshot(), and protojson-marshals snapshot.GetResources() for the
# Listener, Cluster, Route, and Secret types, sorted by name.

# =============================================================================
# PART 1 -- BOOTSTRAP (static, from the ConfigMap)
# =============================================================================
admin:
  address:
    socket_address:
      # ipv4_compat keeps `kubectl port-forward` to the admin port working;
      # in-pod callers dial localhost and need no help.
      address: "::"
      ipv4_compat: true
      port_value: 9901

node:
  id: substrate-envoy-node
  cluster: substrate-router-cluster

# Required for main_internal (see xds.go's buildMainInternalListener):
# Envoy rejects any Listener.internal_listener without this registered,
# with "InternalListener bootstrap extension is mandatory".
bootstrap_extensions:
- name: envoy.bootstrap.internal_listener
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener

dynamic_resources:
  lds_config:
    resource_api_version: V3
    ads: {}
  cds_config:
    resource_api_version: V3
    ads: {}
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    grpc_services:
    - envoy_grpc:
        cluster_name: xds_cluster

static_resources:
  clusters:
  - name: xds_cluster
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: xds_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 18000

