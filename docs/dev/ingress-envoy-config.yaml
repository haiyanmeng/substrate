# Where a terminated CONNECT is reinjected. No address, so it is reachable only
# through the main_internal cluster's envoyInternalAddress. Two differences from
# the socket listeners above are load-bearing:
#
#   - no set_filter_state filter. buildHcm is called with captureAuthority=false
#     here, because connect_terminate already shared dev.ate.authority and the
#     tunnelled request's own :authority is unrelated to the actor addressed.
#   - the original_dst LISTENER filter, whose Host-kind metadata the
#     main_internal cluster's internal_upstream socket passes through.
- filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        accessLog:
        - name: envoy.access_loggers.stdout
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
        generateRequestId: true
        httpFilters:
        - name: envoy.filters.http.ext_proc
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            grpcService:
              envoyGrpc:
                clusterName: ate-cluster
              timeout: 10s
            messageTimeout: 10s
            metadataOptions:
              forwardingNamespaces:
                untyped:
                - envoy.filters.listener.original_dst
              receivingNamespaces:
                untyped:
                - envoy.filters.listener.original_dst
            mutationRules:
              allowAllRouting: true
            processingMode:
              requestHeaderMode: SEND
              requestTrailerMode: SKIP
              responseHeaderMode: SKIP
              responseTrailerMode: SKIP
            requestAttributes:
            - filter_state['dev.ate.authority']
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: substrate_routes
        statPrefix: main_internal
        tracing:
          provider:
            name: envoy.tracers.opentelemetry
            typedConfig:
              '@type': type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
              grpcService:
                envoyGrpc:
                  clusterName: otel_collector_cluster
              serviceName: atenet-router-envoy
          randomSampling:
            value: 1
  internalListener: {}
  listenerFilters:
  - name: envoy.filters.listener.original_dst
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst
  name: main_internal

---
# ---------------------------------------------------------------------------
# CLUSTERS (4)
# ---------------------------------------------------------------------------
clusters:

# The actor. ORIGINAL_DST with CLUSTER_PROVIDED load balancing, so the
# destination is not a configured endpoint: it is read out of the dynamic
# metadata ext_proc returned, at
# envoy.filters.listener.original_dst -> "local" (a <workerIP>:443 string).
#
# explicitHttpConfig pins upstream HTTP/1.1, which is what downgrades an h2
# request from the client -- atunnel's Serve is an HTTP/1.1 reverse proxy.
- connectTimeout: 5s
  lbPolicy: CLUSTER_PROVIDED
  name: actor_original_dst
  originalDstLbConfig:
    metadataKey:
      key: envoy.filters.listener.original_dst
      path:
      - key: local
  transportSocket:
    name: envoy.transport_sockets.tls
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
      commonTlsContext:
        tlsCertificates:
        - certificateChain:
            filename: /run/podidentity.podcert.ate.dev/credential-bundle.pem
          privateKey:
            filename: /run/podidentity.podcert.ate.dev/credential-bundle.pem
        validationContext:
          # The atunnel server cert carries only a spiffe:// URI SAN, so the
          # default SAN check against the dialed pod IP would never match.
          matchTypedSubjectAltNames:
          - matcher:
              prefix: spiffe://cluster.local/
            sanType: URI
          trustedCa:
            filename: /run/podidentity.podcert.ate.dev/trust-bundle.pem
  type: ORIGINAL_DST
  typedExtensionProtocolOptions:
    envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
      '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
      explicitHttpConfig:
        httpProtocolOptions: {}

# The ext_proc server: the atenet router sidecar in this same pod. maxRequests
# is 2 x --parked-request-max, since every parked request holds a slot for its
# whole wait and the excess is fast-path headroom.
- circuitBreakers:
    thresholds:
    - maxRequests: 2048
  connectTimeout: 0.250s
  loadAssignment:
    clusterName: ate-cluster
    endpoints:
    - lbEndpoints:
      - endpoint:
          address:
            socketAddress:
              address: 127.0.0.1
              portValue: 50051
  name: ate-cluster
  type: STATIC
  typedExtensionProtocolOptions:
    envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
      '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
      explicitHttpConfig:
        http2ProtocolOptions: {}

# The only way into the main_internal listener. passthroughMetadata is what
# carries the original_dst listener filter's Host-kind metadata across the
# internal hop; the wrapped socket is raw_buffer because there is no TLS on it.
- loadAssignment:
    clusterName: main_internal
    endpoints:
    - lbEndpoints:
      - endpoint:
          address:
            envoyInternalAddress:
              serverListenerName: main_internal
  name: main_internal
  transportSocket:
    name: internal_upstream
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.transport_sockets.internal_upstream.v3.InternalUpstreamTransport
      passthroughMetadata:
      - kind:
          host: {}
        name: envoy.filters.listener.original_dst
      transportSocket:
        name: raw_buffer
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer
  type: STATIC

# Present only because --otlp-collector-address resolved to something. With it
# empty, buildTracing returns nil and this cluster is not emitted at all.
- connectTimeout: 1s
  loadAssignment:
    clusterName: otel_collector_cluster
    endpoints:
    - lbEndpoints:
      - endpoint:
          address:
            socketAddress:
              address: opentelemetry-collector.gke-managed-otel.svc.cluster.local
              portValue: 4317
  name: otel_collector_cluster
  type: STRICT_DNS
  typedExtensionProtocolOptions:
    envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
      '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
      explicitHttpConfig:
        http2ProtocolOptions: {}

---
# ---------------------------------------------------------------------------
# ROUTES (1), served over RDS to every HCM that is not a CONNECT terminator
#
# One route, prefix "/", no method matcher -- dispatch happens in ext_proc on
# :authority, not here. X-Ate-Target-Port is derived from the same dynamic
# metadata the cluster keys on, and atunnel reads it to pick the actor port.
# ---------------------------------------------------------------------------
routes:
- name: substrate_routes
  virtualHosts:
  - domains:
    - '*'
    name: local_service
    routes:
    - match:
        prefix: /
      requestHeadersToAdd:
      - appendAction: OVERWRITE_IF_EXISTS_OR_ADD
        header:
          key: X-Ate-Target-Port
          value: '%DYNAMIC_METADATA(envoy.filters.listener.original_dst:port)%'
      route:
        cluster: actor_original_dst
        # --route-timeout. idleTimeout is derived from it (see
        # routeIdleTimeout) so a long turn is not cut off by Envoy's five
        # minute stream idle default.
        idleTimeout: 300s
        timeout: 10s

---
# ---------------------------------------------------------------------------
# SECRETS (1), served over SDS on the same ADS stream
#
# The gateway's own serving cert, referenced by both TLS listeners. Emitted
# only when --envoy-cert-path is set. watchedDirectory is what picks up
# kubelet's projected certificate rotation without a restart.
# ---------------------------------------------------------------------------
secrets:
- name: https_serving_cert
  tlsCertificate:
    certificateChain:
      filename: /run/servicedns.podcert.ate.dev/credential-bundle.pem
    privateKey:
      filename: /run/servicedns.podcert.ate.dev/credential-bundle.pem
    watchedDirectory:
      path: /run/servicedns.podcert.ate.dev
