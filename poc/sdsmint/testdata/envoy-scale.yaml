# MEASUREMENT CONFIG -- the on-demand arm of run-scale.sh.
#
# FOR DEPLOYMENT, USE ../deploy/envoy-egress.yaml INSTEAD. This file is shaped
# for measurement, and two of its choices would be wrong in production.
#
# It is envoy-bootstrap-good.yaml with three changes, each one made so that a
# number the harness reads means what it looks like:
#
#  1. transport_socket_connect_timeout is 30s rather than 5s. At 5s, a proxy
#     under saturation converts latency into handshake failures, and the
#     saturation phase would report a failure count where it wants a latency
#     curve. 30s is above any handshake this design should ever produce, so
#     slowness stays visible as slowness. Production wants the short one.
#  2. No prefetch_secret_names. The synthetic host set is walked by the load
#     generator; prefetching a name outside it only adds a startup dependency.
#  3. No default_value on the sni mapper... except there has to be one, because
#     the field is how a no-SNI connection is handled and Envoy needs it set.
#     It points at a name the null minter's wildcard covers.
#
# envoy-static.yaml is the control: this file with the whole on-demand selector
# replaced by one static certificate.
#
# Requires Envoy 1.37 or newer.
#
# Paths are relative to the working directory Envoy is started in, which
# run-scale.sh sets to poc/sdsmint/__run.

node:
  id: sdsmint-scale
  cluster: sdsmint-scale

admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 19000}

static_resources:
  listeners:
  - name: mitm
    stat_prefix: mitm
    address:
      socket_address: {address: 127.0.0.1, port_value: 18443}
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mitm_http
          route_config:
            name: local
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes:
              - match: {prefix: "/"}
                direct_response:
                  status: 200
                  body:
                    inline_string: "mitm ok\n"
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      # Deliberately long: see the header. Under saturation this keeps slow
      # handshakes measurable instead of turning them into failures.
      transport_socket_connect_timeout: 30s
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            custom_tls_certificate_selector:
              name: on-demand
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.cert_selectors.on_demand_secret.v3.Config
                config_source:
                  api_config_source:
                    api_type: DELTA_GRPC
                    transport_api_version: V3
                    grpc_services:
                    - envoy_grpc:
                        cluster_name: sds_mint
                certificate_mapper:
                  name: sni
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.cert_mappers.sni.v3.SNI
                    default_value: "default.mitm.example"
          disable_stateless_session_resumption: true
          disable_stateful_session_resumption: true

  clusters:
  - name: sds_mint
    type: STATIC
    connect_timeout: 1s
    # MEASURED, NOT PRECAUTIONARY. Envoy opens one DELTA_GRPC stream per
    # on-demand secret name and holds it open for as long as the secret is
    # live -- so the live secret count is a concurrent-request count against
    # this cluster. Envoy's default circuit breaker is max_requests: 1024, and
    # with it in place the 1025th distinct SNI never gets a certificate: the
    # subscription overflows, no response arrives, and the handshake fails
    # 15s later with "initial fetch timed out for ...v3.Secret". This harness
    # hit that wall at exactly 1024 before these thresholds were added.
    #
    # 200000 is not a capacity plan, it is the removal of a limit that would
    # otherwise be the thing being measured.
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 100000
        max_pending_requests: 100000
        max_requests: 200000
        max_retries: 3
      - priority: HIGH
        max_connections: 100000
        max_pending_requests: 100000
        max_requests: 200000
        max_retries: 3
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            # The rotation phase pushes every live name in one response, which
            # at a few thousand names is megabytes. Envoy's default window is
            # 256KB, so without raising it the measurement would be of HTTP/2
            # flow control rather than of rotation.
            initial_stream_window_size: 16777216
            initial_connection_window_size: 16777216
    load_assignment:
      cluster_name: sds_mint
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              pipe: {path: ./sdsmint.sock}
