# Hermetic PoC bootstrap for mint.md's recommended design (Option C):
# on_demand_secret certificate selector + sni certificate mapper, backed by the
# sdsmintd minting SDS server over a unix socket.
#
# Requires Envoy 1.37 or newer. The two extensions used here do not exist in
# 1.36 or earlier -- notably not in the v1.30-latest that
# manifests/ate-install/atenet-router.yaml currently pins.
#
# The upstream is a direct_response so that this file proves exactly one thing
# -- that a leaf is minted per SNI on demand -- with no other moving parts. See
# envoy-bootstrap-fwdproxy.yaml for the variant that really re-originates.
#
# Paths are relative to the working directory Envoy is started in, which
# run-poc.sh sets to poc/sdsmint/__run.

# SDS subscriptions are rejected outright unless the node has an id and a
# cluster, because the management server keys state off them.
node:
  id: sdsmint-poc
  cluster: sdsmint-poc

admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 19000}

static_resources:
  listeners:
  - name: mitm
    # stat_prefix is what makes the on-demand counters addressable as
    # listener.mitm.on_demand_secret.* rather than being keyed by address.
    stat_prefix: mitm
    address:
      socket_address: {address: 127.0.0.1, port_value: 18443}
    listener_filters:
    # Required: without it Envoy never reads the ClientHello, so the sni
    # mapper has nothing to map and every request collapses to default_value.
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mitm_http
          route_config:
            name: local
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes:
              - match: {prefix: "/"}
                direct_response:
                  status: 200
                  body:
                    inline_string: "mitm ok\n"
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      # NOTE: transport_socket_connect_timeout is deliberately absent here so
      # that run-poc.sh can demonstrate the default behaviour -- with SDS down,
      # a cold SNI pauses the handshake forever (measured: still waiting after
      # 20s, and after 3min by hand). Envoy never gives up on its own. Any real
      # deployment MUST set it; the harness generates a 5s variant of this file
      # to prove it bounds the stall.
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            custom_tls_certificate_selector:
              name: on-demand
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.cert_selectors.on_demand_secret.v3.Config
                config_source:
                  api_config_source:
                    api_type: DELTA_GRPC
                    transport_api_version: V3
                    grpc_services:
                    - envoy_grpc:
                        cluster_name: sds_mint
                certificate_mapper:
                  name: sni
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.cert_mappers.sni.v3.SNI
                    # Used when a client connects without SNI. It must be in
                    # sdsmintd's --allow list or those handshakes fail.
                    default_value: "default.mitm.example"
                # Fetched at config load, before any request arrives.
                prefetch_secret_names:
                - default.mitm.example
          # Resumption would let a client skip the handshake and therefore skip
          # certificate selection entirely. Envoy does not support it for
          # on-demand certificates; disabling it is required, not cosmetic.
          disable_stateless_session_resumption: true
          disable_stateful_session_resumption: true

  clusters:
  - name: sds_mint
    type: STATIC
    connect_timeout: 1s
    # SDS is a gRPC service, so the cluster must speak HTTP/2.
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: sds_mint
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              # A unix socket keeps leaf private keys off the network, which is
              # the "local-only channel" control from mint.md.
              pipe: {path: ./sdsmint.sock}
