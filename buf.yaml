version: v2

# One module rooted at the repository, so a proto's import path is its path
# from the root. That is what hack/update/codegen.sh compiles with
# (`protoc -I "${ROOT}"`), and what internal/proto/ateletpb/atelet.proto
# already relies on when it imports "pkg/proto/ateapipb/ateapi.proto".
modules:
  - path: .
    excludes:
      # Build output, not source.
      - bin
      # Third-party protos. Their compatibility is upstream's to manage, and
      # a breaking change there arrives as a dependency bump we cannot fix by
      # editing the file.
      - vendor
      - cmd/ateom-microvm/internal/third_party

breaking:
  # WIRE, not WIRE_JSON or FILE.
  #
  # The control plane persists resources as binary protobuf in bytea columns
  # (cmd/ateapi/internal/store/atepg/atepg.go), and binary protobuf keys every
  # field on its field number alone. WIRE is therefore exactly the boundary
  # that protects data already in the database: it rejects renumbering a
  # field, reusing a retired number, deleting a field without reserving it,
  # and changing a field's type or cardinality, while permitting the renames
  # that cost stored rows nothing.
  use:
    - WIRE
