# The orchestrator deploys + tears down substrate + workloads around each
# test so runs don't pollute each other.
#
# Fields shared by every entry:
#
#   type           Required. Selects the runner: "locust" | "nighthawk-ingress".
#                  Each type's own fields are described in its section.
#   targetCluster  Required. Names a config file under
#                  /etc/orchestrator/target-clusters/ (e.g. `targetCluster:
#                  dev` -> /etc/orchestrator/target-clusters/dev.sh). The
#                  orchestrator copies that file into the cloned repo as
#                  .ate-dev-env.sh before the test runs and deletes it
#                  after, so different tests can target different clusters
#                  / projects from one CronJob run.
#   sandboxClass   Optional (default "gvisor"). Sandbox runtime for the
#                  benchmark WorkerPool: "gvisor" | "microvm".
#   workerCount    Optional (default 1). WorkerPool replica count for the
#                  deploy that runs before this test. The orchestrator
#                  redeploys workloads between tests, so each test can
#                  pick its own scale.
#   actorMemory    Optional (default "256Mi", the smallest size microvm
#                  admits). Memory limit on the benchmark ActorTemplates;
#                  raise it for suites that exercise glutton's WriteRAM path.
#   workerMemory   Optional (default unset: the worker pods have no requests
#                  or limits). Memory request and limit on each WorkerPool
#                  pod. Use it to fix how many workers share a node: one per
#                  node needs more than half the node's allocatable memory.
#                  The limit is also the memory the worker reports as its
#                  actor capacity.
#   workerWaitTimeout
#                  Optional (default 300, set by workloads/deploy.sh).
#                  Whole seconds to wait after the WorkerPool deploy for
#                  the ateom worker pods to become ready. Raise it for
#                  large workerCount fleets whose image pulls or scheduling
#                  outrun the default.
#   ateArgs        Optional. List of strings appended verbatim to
#                  `hack/install-ate.sh --deploy-ate-system` when this
#                  test's substrate is deployed (e.g. ["--atenet-dataplane=agentgateway"]).
#                  The deploy requires --credential-provider; set it here
#                  as one YAML string, '--credential-provider={"name":"k8s.io"}'
#                  (no shell quoting: the args are passed without a shell),
#                  or as ATE_CREDENTIAL_PROVIDER in .ate-dev-env.sh.
#   fakeDataPlane  Optional. Serves the WorkerPool with the fake data plane
#                  (workloads/deploy.sh --fake-data-plane) instead of worker
#                  pods: fake-atelet takes atelet's place on `nodes` nodes
#                  and answers every lifecycle call after `delay`, and
#                  fake-workersync honors the pool with workerCount fake
#                  Workers on them, each reporting the capacity a real
#                  worker would. ate-api-server and Postgres can then be
#                  driven past what real nodes restore. Keys: nodes, run,
#                  delay (deploy.sh's defaults when omitted). Actors do not
#                  exist, so the entry's user class must send them no
#                  requests. The teardown undoes it.
#
# ---- type: locust -----------------------------------------------------------
#
# Runs `runner.py -f <file> -t <duration> -u <users> --name <name>` in a
# Job, with --tag set to the build commit hash and --dest from the
# orchestrator's --dest flag. `file`, `duration` and `users` are required.
# Optional `flags` is a list of arbitrary strings appended to runner.py's
# argv; runner.py forwards them to locust verbatim.
#
# Optional `runnerCpu` (default "500m") and `runnerMemory` (default "512Mi")
# are the runner pod's requests. They are requests only, no limits, so the
# pod lands on a node with that much free and may burst beyond it. Raise
# them for boomer-driven classes at thousands of users: agentsession holds
# one goroutine per session and marshals up to 32Mi per in-flight ingest,
# so 1000+ sessions want on the order of 4 CPU and 8Gi on a node that has it.
#
# `file` is one path, or a comma-separated list of paths that locust reads as
# one test. Give the test first, then each load shape. A shape changes the
# load while the run continues; the shapes are in benchmarking/locust/shapes/.
#
# `--ladder users:duration[:trace_probability],...` with
# shapes/ladder_shape.py in `file` makes a sweep one run. The shape owns the
# load and the end of the run, thus locust ignores `-t` and `users` is the
# count before the first tick only. Keep `duration` at the total of the steps:
# the orchestrator sizes the Job timeout from it.
#
# A step of the ladder that gives a trace probability changes the sample rate
# when the step starts, and the new rate stays until another step changes it.
# `--trace-probability` in `flags` is the rate before the first such step.
# Thus a ladder with no probability in any step keeps the rate of the flag.
#
# A step can end in `@target_rps` (e.g. `200:3m@4000`), which caps the
# requests per second of the whole boomer worker from the step's start; 0
# removes the cap. Boomer users that pace themselves (resumecold) honor it.
# Keep `users` at or above the rate times the p99 of one user iteration in
# seconds, or the step falls short of its rate. A resumecold iteration is a
# resume plus a pause, so size it by the p99 of both together.
#
# An optional `ateapi:` block shapes the control plane for a capacity run of
# ate-api-server and Postgres; pre_test applies it after the deploy:
#   cpu            Required. CPU of each ate-api-server replica, set as both
#                  request and limit (e.g. 2 or "1500m").
#   memory         Optional (default "4Gi"). Memory request and limit.
#   replicas       Optional (default 1).
#   poolMaxConns   Optional. pgxpool max connections per replica, set
#                  through ateapi's env ConfigMap. Unset keeps the installed
#                  value.
#   pgStats        Optional (default true). Load pg_stat_statements and add
#                  a postgres_exporter sidecar, scraped by monitoring.yaml.
#   pinNodes       Optional (default true). Label one node for ateapi and
#                  another for the runner, away from the Postgres node, and
#                  pin each there. Every ateapi replica shares its node,
#                  which must have the CPU for all of them; fake-atelet may
#                  run there too. The runner takes a node of the pool
#                  reserved for load generators when there is one. Not with
#                  --cordon-control-plane in ateArgs.
#
# ---- type: nighthawk-ingress --------------------------------------------------------
#
# Runs the Nighthawk adaptive router-capacity benchmark. `duration` is the
# job-wait budget only; the test knobs live in a `nighthawk-ingress:` block — see
# the "Configuration knobs" table in benchmarking/nighthawk-ingress/README.md.
# `workerCount` is required: the benchmark warms one actor per worker, so
# it is also the actor fleet size.

tests:
  - name: glutton_baseline_1_user
    type: locust
    description: "Glutton baseline: 1 concurrent user for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_baseline_1_user_pause
    type: locust
    description: "Glutton baseline (pause): 1 concurrent user for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--lifecycle-mode"
      - "pause"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  # Large-memory variants: same load shape as the 1-user baseline, but the
  # GluttonUser fills the actor's RAM to --mem-target through the
  # glutton WriteRAM API before the first suspend, so every suspend/resume
  # cycle is measured against a realistically-sized actor. actorMemory =
  # target + headroom (glutton itself, the guest, and on microvm the 128Mi
  # VMM reserve). The golden snapshot and cold boot stay small: the working
  # set exists from the first fill onward. --mem-churn re-randomizes 64Mi
  # each cycle through an advancing window (WriteRAM rotate), so repeated
  # suspends snapshot changing memory rather than a static set and the dirty
  # window moves across the array. --mem-read walks the whole working set
  # right after every resume, one byte per page, so under a demand-paged
  # restore the GluttonReadRAM row is the cost of paging the previous
  # snapshot's memory back in.
  - name: glutton_mem_1gi_gvisor
    type: locust
    description: "Large-memory: 1Gi resident working set, gvisor"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    actorMemory: "1536Mi"
    flags:
      - "--mem-target"
      - "1Gi"
      - "--mem-churn"
      - "64Mi"
      - "--mem-read"
      - "all"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_mem_1gi_gvisor_pause
    type: locust
    description: "Large-memory (pause): 1Gi resident working set, gvisor"
