  # ate-api-server and Postgres cold resume ceiling on the fake data plane.
  # Every user takes a paused actor from the shared fleet, resumes it and
  # pauses it again; FleetExhausted failures mark a step the fleet could not
  # cover. fake-atelet answers each call, restore and checkpoint alike,
  # after 150 ms on all three nodes, so a cycle spends 300 ms in the data
  # plane, after minting the actor's certificate on each restore as ateom
  # does. The 200 fake Workers hold
  # 1000 actors each, so placement never binds. resumecold sends the actors
  # no requests, which the fake data plane needs.
  - name: ateapi_cold_resume_pause_fake_2cpu
    type: locust
    description: "ate-api-server cold resume on the fake data plane, ate-api-server at 2 CPUs: rate ladder 100-1500 cold resumes/s"
    targetCluster: dev
    file: /app/tests/resumecold.py,/app/shapes/ladder_shape.py
    duration: 23m
    users: 1000
    workerCount: 200
