# extprocd: the external processor for the egress gateway's INNER checkpoint --
# the decrypted leg of the MITM, where the destination hostname is finally
# visible. The gateway calls it once per HTTP request on every tunnel, over
# the inner_ext_proc_server cluster in manifests/ate-install/atenet-egress.yaml.
#
# Why this is a Deployment and not a third container in the gateway pod. The
# CONNECT checkpoint's processor is a sidecar because it runs once per tunnel
# and needs the gateway's own ateapi credentials. This one runs once per
# REQUEST, so its load tracks request rate rather than actor count, and a
# sidecar would tie that scaling to the number of Envoys.
#
# AVAILABILITY IS NOT OPTIONAL. The filter is configured failure_mode_allow:
# false, so an extprocd that is unreachable does not degrade MITM'd egress, it
# stops it: every decrypted request gets a 500. Passthrough is unaffected --
# which is the awkward part, because the gateway then looks half-working rather
# than down. Deploy this before the gateway, and confirm the Service has ready
# endpoints before assuming an egress failure is a policy decision.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-egress-extproc
  namespace: ate-system
# No RBAC and no token. extprocd decides on the request in front of it and
# nothing else -- it reads no Kubernetes objects and calls no ate API -- so
# mounting a projected service account token would only be handing a
# request-path process a credential it has no use for.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atenet-egress-extproc
  namespace: ate-system
  labels:
    app: atenet-egress-extproc
spec:
  # Two, because of the fail-closed note above: a single replica makes every
  # rollout and every node drain an egress outage for MITM'd traffic.
  replicas: 2
  selector:
    matchLabels:
      app: atenet-egress-extproc
  template:
    metadata:
      labels:
        app: atenet-egress-extproc
    spec:
      serviceAccountName: atenet-egress-extproc
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: extprocd
        image: ko://github.com/agent-substrate/substrate/cmd/extprocd
        args:
        - --addr=:50051
        - --log-level=info
        # Allow-all as shipped. This is not the absence of policy: an actor
        # already had to authenticate at the CONNECT checkpoint to get a tunnel
        # at all. What is absent is a hostname-level allowlist on top of that,
        # and turning one on should be a visible change here rather than
        # something this Deployment did by existing. Add --deny-host=NAME
        # (repeatable) to refuse specific destinations.
        #
        # Credential injection has no flag, on purpose. extprocd can add a
        # GitHub PAT to requests bound for api.github.com and github.com, so
        # that the actor never holds the token -- but the token is the
        # githubToken constant in cmd/extprocd/internal/inner/inner.go, empty in
        # the repository and set by editing and rebuilding. Check the startup
        # log line's github_token field to see whether the running image has
        # one. A flag or an env var here would put the credential in this
        # manifest, which is the one place it must not be.
        ports:
        - name: extproc
          containerPort: 50051
        # A TCP probe, matching the gateway's own ext-proc sidecar. It proves
        # the listener is bound, which is the failure this catches: extprocd
        # has no dependencies to be unready against.
        readinessProbe:
          tcpSocket:
            port: extproc
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: extproc
          periodSeconds: 20
        # Sized against request rate, not actor count. The work per request is
        # a map build and a lookup on headers Envoy already parsed; the floor
        # here is the Go runtime and the h2 stream churn of one stream per
        # request, not the policy.
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-egress-extproc
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: atenet-egress-extproc
  ports:
  - name: extproc
    port: 50051
    targetPort: extproc
    protocol: TCP
